name: borska-farmica-production-example
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: [.env.production]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['4000:4000']
    networks: [backend]
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  backend: { internal: true }
volumes:
  postgres_data:
