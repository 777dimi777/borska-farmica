name: borska-farmica

services:
  postgres:
    image: postgres:17-alpine
    container_name: borska-farmica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: borska_farmica
      POSTGRES_USER: borska_farmica
      POSTGRES_PASSWORD: local_development_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U borska_farmica -d borska_farmica"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
